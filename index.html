<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#4f46e5">
    <title>英単語テスト</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="英単語テスト">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5.10">
    <link rel="stylesheet" href="css/quiz-animations.css?v=5.10">
    <link rel="stylesheet" href="css/microinteractions.css?v=5.10">
</head>
<body>
    <div class="app-layout">
        <!-- トップナビ / ヘッダー -->
        <header class="app-header">
            <div class="header-inner">
                <div class="brand">
                    <span class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    </span>
                    <h1 class="brand-name">英単語テスト</h1>
                    <span id="active-set-badge" class="badge-set">Target 1400</span>
                </div>

                <!-- ヘッダー右側アクション（PWAインストールボタン等） -->
                <div class="header-actions">
                    <button id="btn-header-install" class="btn-header-install" style="display: none;" type="button" aria-label="アプリをインストール" title="ホーム画面・デスクトップにアプリとして追加">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                        <span>アプリ追加</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ（各画面のスロット） -->
        <main class="app-main">
            <section id="view-learn" class="view-panel active"></section>
            <section id="view-quiz" class="view-panel" style="display: none;"></section>
            <section id="view-words" class="view-panel" style="display: none;"></section>
            <section id="view-stats" class="view-panel" style="display: none;"></section>
        </main>

        <!-- ナビゲーション（スマホ: ボトム固定 / PC: ヘッダー配置） -->
        <nav class="app-nav" id="app-nav">
            <button class="nav-item active" data-tab="learn">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </span>
                <span class="nav-label">テスト</span>
            </button>
            <button class="nav-item" data-tab="words">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
                </span>
                <span class="nav-label">単語帳</span>
            </button>
            <button class="nav-item" data-tab="stats">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><line x1="4" x2="4" y1="21" y2="14"></line><line x1="4" x2="4" y1="10" y2="3"></line><line x1="12" x2="12" y1="21" y2="12"></line><line x1="12" x2="12" y1="8" y2="3"></line><line x1="20" x2="20" y1="21" y2="16"></line><line x1="20" x2="20" y1="12" y2="3"></line><line x1="1" x2="7" y1="14" y2="14"></line><line x1="9" x2="15" y1="8" y2="8"></line><line x1="17" x2="23" y1="16" y2="16"></line></svg>
                </span>
                <span class="nav-label">設定</span>
            </button>
        </nav>
    </div>

    <script type="module" src="js/app.js?v=5.10"></script>
</body>
</html>
